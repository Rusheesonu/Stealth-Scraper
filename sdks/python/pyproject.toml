[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stealth-scraper"
version = "0.1.0"
description = "Official Python SDK for the Stealth Scraper API — snapshot, extract, and AI-assisted scraping with anti-bot bypass."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Stealth Scraper", email = "hello@stealthscraper.dev" },
]
keywords = ["scraping", "web-scraping", "anti-bot", "stealth", "playwright", "automation", "extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://stealthscraper.dev"
Documentation = "https://stealthscraper.dev/docs"
Repository = "https://github.com/stealth-scraper/stealth-scraper"
Issues = "https://github.com/stealth-scraper/stealth-scraper/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["stealth_scraper"]

[tool.hatch.build.targets.sdist]
include = [
    "stealth_scraper",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
