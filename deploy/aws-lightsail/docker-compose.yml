# Backend container definition for AWS Lightsail production.
#
# Loaded by:
#   docker compose --env-file /opt/stealth-scraper/.env.production up -d
#
# Caddy on the host listens on 80/443 and reverse-proxies to localhost:7860
# (defined in /etc/caddy/Caddyfile). The container itself binds only to
# 127.0.0.1 so it's not directly reachable from the public internet.

# Explicit project name so future renames of this directory don't cause
# the "container_name in use" conflict (which iter 17 hit when renaming
# deploy/hetzner → deploy/aws-lightsail). Compose normally derives the
# project name from the parent dir.
name: stealth-scraper

services:
  backend:
    image: stealth-scraper-backend:latest
    container_name: stealth-scraper-backend
    restart: unless-stopped
    # Bind only to loopback — Caddy is the only thing that talks to us.
    ports:
      - "127.0.0.1:7860:7860"
    # All secrets come from .env.production (gitignored).
    # The container only sees the env vars listed here, not the whole file.
    environment:
      # Supabase auth — verifies user JWTs via JWKS
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      # Postgres (Supabase Session Pooler URL)
      DATABASE_URL: ${DATABASE_URL}
      # Lemon Squeezy billing
      LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID}
      LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY}
      LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET}
      LEMONSQUEEZY_STORE_URL: ${LEMONSQUEEZY_STORE_URL}
      LS_VARIANT_HOBBY: ${LS_VARIANT_HOBBY}
      LS_VARIANT_PRO: ${LS_VARIANT_PRO}
      LS_VARIANT_BUSINESS: ${LS_VARIANT_BUSINESS}
      # LLM (Groq by default; fallback chain in app/assist.py)
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      # Optional override — leave unset to use the default chain.
      LLM_MODELS: ${LLM_MODELS:-}
      # Residential / datacenter proxy pool. PROXIES_ENABLED is the
      # master switch; PROXIES_JSON carries the actual creds+endpoints
      # (single-line JSON matching proxies.py schema). PROXIES_JSON was
      # added 2026-05-21 — earlier versions only forwarded the boolean
      # flag, which meant the pool silently fell back to "no proxies" no
      # matter how PROXIES_JSON was set in .env.production.
      PROXIES_ENABLED: ${PROXIES_ENABLED:-false}
      PROXIES_JSON: ${PROXIES_JSON:-}
      # Admin allowlist (csv emails) — get unlimited "admin" plan + bypass
      # public-endpoint IP rate limit. Comma-separated, case-insensitive.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Webhook signing for outbound scheduled-scrape delivery
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET}
      # FastAPI / uvicorn settings
      PORT: 7860
      PYTHONUNBUFFERED: "1"
      # Allow Chromium to write its sandbox to /tmp inside the container
      CHROME_USER_DATA_DIR: /tmp/chrome-user-data
    # Resource limits — leave headroom for the OS + Caddy + cron.
    # CX32 has 8GB total; cap container at 6.5GB so we don't OOM the host.
    deploy:
      resources:
        limits:
          memory: 6500M
        reservations:
          memory: 1024M
    # Health check — Docker uses this to know if the container is alive.
    # `restart: unless-stopped` + health check = auto-recover from hangs.
    # Uses python stdlib (urllib) because the python:3.12-slim base image
    # has no curl — the previous `curl -f …` test always failed with
    # "executable file not found", leaving the container permanently
    # marked "unhealthy" even when serving fine.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7860/status', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Chromium downloads on first run can be slow
    # Logging — cap container log size so disk doesn't fill silently.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
